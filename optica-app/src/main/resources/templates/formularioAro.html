<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Aro - Óptica</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        .btn-cancel { background-color: #dc3545; text-decoration: none; display: block; text-align: center; margin-top: 10px; padding: 10px; color: white; border-radius: 4px;}
    </style>
</head>
<body>
<div class="container">
    <h1>Registrar Nuevo Aro</h1>

    <!-- El form envía los datos a la ruta /vendedor/aros/guardar por POST -->
    <form action="/vendedor/aros/guardar" method="post" th:object="${aro}">
        <div class="form-group">
            <label>Marca:</label>
            <input type="text" th:field="*{marca}" required>
        </div>
        <div class="form-group">
            <label>Material:</label>
            <input type="text" th:field="*{material}" required>
        </div>
        <div class="form-group">
            <label>Forma:</label>
            <input type="text" th:field="*{forma}" required>
        </div>
        <div class="form-group">
            <label>Precio ($):</label>
            <input type="number" step="0.01" th:field="*{precio}" required>
        </div>
        <div class="form-group">
            <label>Stock (Cantidad):</label>
            <input type="number" th:field="*{stock}" required>
        </div>

        <button type="submit" class="btn">Guardar Aro</button>
        <a href="/vendedor/inventario" class="btn-cancel">Cancelar</a>
    </form>
</div>
</body>
</html>
