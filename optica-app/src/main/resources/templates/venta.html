<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta - Óptica</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .mensaje { background-color: #d4edda; color: #155724; padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; text-align: center;}
    </style>
</head>
<body>
<div class="container">
    <h1>Registrar Nueva Venta</h1>

    <!-- Mensaje de éxito o error -->
    <div th:if="${mensaje}" class="mensaje" th:text="${mensaje}"></div>

    <form action="/vendedor/ventas/procesar" method="post">
        <div class="form-group">
            <label>ID del Cliente (Ej. 1):</label>
            <input type="number" name="clienteId" value="1" required>
        </div>
        <div class="form-group">
            <label>ID de Medición (Ej. 1):</label>
            <input type="number" name="medicionId" value="1" required>
        </div>
        <div class="form-group">
            <label>Seleccionar Aro:</label>
            <select name="aroId" required>
                <option th:each="aro : ${listaAros}" th:value="${aro.id}" th:text="${aro.marca} + ' - $' + ${aro.precio} + ' (Stock: ' + ${aro.stock} + ')'"></option>
            </select>
        </div>
        <div class="form-group">
            <label>Cantidad:</label>
            <input type="number" name="cantidad" value="1" min="1" required>
        </div>

        <button type="submit" class="btn">Procesar Venta y Descontar Stock</button>
    </form>
    <br>
    <a href="/vendedor/inventario" style="display:block; text-align:center; color: #007bff;">Volver al Inventario</a>
</div>
</body>
</html>
